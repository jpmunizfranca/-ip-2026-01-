<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Paciente - CRUD Hospital</title>
    <link rel="stylesheet" href="../styles/registrar.style.css">
</head>
<body>
    <div id="container">
        <div id="form-box">
            <h1>Editar Paciente</h1>
            <form method="POST" action="/editarSalvar">
                <input type="hidden" name="id" value="{{.ID}}">
                
                <div>
                    <label>Nome Completo:</label>
                    <input type="text" name="nomeCompleto" value="{{.NomeCompleto}}" required>
                </div>
                <div>
                    <label>CPF:</label>
                    <input type="text" name="cpf" value="{{.CPF}}" required>
                </div>
                <div>
                    <label>Data de Nascimento:</label>
                    <input type="date" name="dataNascimento" value="{{.DataNascimento}}" required>
                </div>
                <div>
                    <label>Telefone:</label>
                    <input type="tel" name="telefone" value="{{.Telefone}}" required>
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" name="email" value="{{.Email}}" required>
                </div>
                <div>
                    <label>Data de Internação:</label>
                    <input type="date" name="dataInternacao" value="{{.DataInternacao}}" required>
                </div>
                <div>
                    <label>Hora de Internação:</label>
                    <input type="time" name="horaInternacao" value="{{.HoraInternacao}}" required>
                </div>
                <div>
                    <label>Motivo da Internação:</label>
                    <textarea name="motivoInternacao" required rows="4">{{.MotivoInternacao}}</textarea>
                </div>
                <div id="buttons">
                    <button type="submit">Salvar Alterações</button>
                    <a href="/listar" class="btn-voltar">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
