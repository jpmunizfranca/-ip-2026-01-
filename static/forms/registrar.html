<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Paciente - CRUD Hospital</title>
    <link rel="stylesheet" href="../styles/registrar.style.css">
</head>
<body>
    <div id="container">
        <div id="form-box">
            <h1>Registrar Novo Paciente</h1>
            <form method="POST" action="/registrar">
                <div>
                    <label>Nome Completo:</label>
                    <input type="text" name="nomeCompleto" placeholder="Digite o nome completo" required>
                </div>
                <div>
                    <label>CPF:</label>
                    <input type="text" name="cpf" placeholder="000.000.000-00" required>
                </div>
                <div>
                    <label>Data de Nascimento:</label>
                    <input type="date" name="dataNascimento" required>
                </div>
                <div>
                    <label>Telefone:</label>
                    <input type="tel" name="telefone" placeholder="(00) 00000-0000" required>
                </div>
                <div>
                    <label>Email:</label>
                    <input type="email" name="email" placeholder="paciente@email.com" required>
                </div>
                <div>
                    <label>Data de Internação:</label>
                    <input type="date" name="dataInternacao" required>
                </div>
                <div>
                    <label>Hora de Internação:</label>
                    <input type="time" name="horaInternacao" required>
                </div>
                <div>
                    <label>Motivo da Internação:</label>
                    <textarea name="motivoInternacao" placeholder="Digite o motivo da internação" required rows="4"></textarea>
                </div>
                <div id="buttons">
                    <button type="submit">Registrar</button>
                    <a href="/menu.html" class="btn-voltar">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
